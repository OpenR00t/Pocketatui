[package]
name = "pocketatui"
version = "0.1.0"
description = "Pocket Casts in the terminal"
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "http2", "charset", "system-proxy", "gzip"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
whisper-rs = { version = "0.16", optional = true }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[features]
default = []
# Local transcription with Whisper (needs CMake and a C++ compiler to build).
whisper = ["dep:whisper-rs"]
# Whisper on the GPU: Vulkan (NVIDIA / AMD / Intel; needs the Vulkan SDK) or CUDA (NVIDIA; needs the CUDA toolkit).
vulkan = ["whisper", "whisper-rs/vulkan"]
cuda = ["whisper", "whisper-rs/cuda"]
